name: PostAir API Regression & Error Handling Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman CLI & HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Start Mock Server
        run: |
          node mock-server.js &
          sleep 3

      - name: Verify Mock Server Health
        run: |
          curl -f http://localhost:3001/health || exit 1

      - name: Execute Postman Suite via Newman
        run: |
          newman run "PostAir Weather API.postman_collection.json" \
            -e "PostAirTesting.postman_environment.json" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-report
          path: newman-report.html